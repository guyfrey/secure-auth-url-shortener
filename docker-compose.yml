version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: auth-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    container_name: auth-service
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/authdb?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=f54cbfdb9449807386ac2d98f52ea593
      - JWT_REFRESH_SECRET=7e5fbf327622c68ceb2f062db11efb0c
      - RESEND_API_KEY=re_YMqPS1P9_6n3UPJVCbyqLaoP1ZhdhfNsf
      - PORT=5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app

  shortener:
    build:
      context: .
      dockerfile: apps/shortener/Dockerfile
    container_name: shortener-service
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/authdb?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=f54cbfdb9449807386ac2d98f52ea593
      - PORT=5001
      - BASE_URL=http://localhost:5001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      auth:
        condition: service_started  
    volumes:
      - .:/app

volumes:
  pgdata: